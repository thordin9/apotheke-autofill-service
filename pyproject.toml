[project]
name = "apotheke-autofill-service"
version = "2.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
# The bench archive is a recorded run. Leave those files byte-identical.
extend-exclude = ["bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
