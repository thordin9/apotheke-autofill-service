# /etc/systemd/system/ollama.service.d/10-autofill.conf
# Jetson Ollama tuning (kept on the board after the 2026-10-20 decommission; it is not specific to autofill).
# qwen2.5vl's vision graph needs a 7.3 GiB CUDA buffer without flash attention; keep one model and one slot
# so nothing else competes with qwen2.5vl-jetson:3b for the 6.8 GB of shared memory.
[Service]
# No effect on this GPU (compute 7.2: Ollama logs "flash attention enabled but not supported by gpu"); harmless.
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NUM_PARALLEL=1"
