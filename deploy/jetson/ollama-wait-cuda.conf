# /etc/systemd/system/ollama.service.d/ollama-wait-cuda.conf
# Delay Ollama's start until the Jetson GPU is usable. Without this, a reboot can leave Ollama on library=cpu
# (device nodes already present, CUDA not initialisable yet) until a manual restart. wait-cuda.sh checks the device
# nodes and sysfs, then polls a bounded cuInit probe as the ollama user. It exits 0 on timeout so this never fails
# the unit; ollama-gpu-check.service still restarts Ollama once per boot if discovery logged only library=cpu.
[Unit]
# NVIDIA's L4T boot units (both present on the board; nv.service takes about 1 s). Ordering only: if a unit is
# missing, After= is ignored, and nothing extra is pulled in.
After=nv.service nvpmodel.service

[Service]
# No "+" prefix: ExecStartPre runs as the unit's User= (ollama, from Ollama's installer), so the cuInit probe sees
# the same permissions as Ollama. As root, wait-cuda.sh switches to the ollama user with runuser.
ExecStartPre=/usr/local/sbin/wait-cuda.sh
# ExecStartPre counts toward the start timeout (DefaultTimeoutStartSec, 90 s). wait-cuda.sh caps CUDA_WAIT_S at
# 150 s; the last probe gets only the time left (at least 1 s, plus 2 s to kill it), so it overruns by at most
# 3 s: 153 s worst case, inside this.
TimeoutStartSec=180
