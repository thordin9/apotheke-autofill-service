# /etc/systemd/system/ollama.service.d/ollama-wait-cuda.conf
# Delay Ollama's start until the Jetson GPU looks usable. Without this, a reboot can leave Ollama on
# library=cpu (device nodes already present, nvgpu/CUDA not ready yet) until a manual restart.
# wait-cuda.sh exits 0 on timeout so this never fails the unit; ollama-gpu-check.service still restarts
# Ollama once per boot if discovery logged only library=cpu.
[Service]
ExecStartPre=/usr/local/sbin/wait-cuda.sh
