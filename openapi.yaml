openapi: 3.1.0
info:
  title: Apotheke Autofill Service
  version: "1"
  description: |
    Suggests item field values (name, category, tags, description) from a photo.
    Any backend must implement this contract. See docs/api-v1.md.
    Clients MUST treat any non-200 response or unparsable body as "no suggestions"
    and MUST ignore unknown fields. Version bumps within v1 are additive only.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
security:
  - {}
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe (never requires auth; status only, no model inventory)
      security: []
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    const: ok
        "503":
          description: |
            Degraded. A model that is warm, or the loaded production model, is
            in Ollama's memory with size_vram 0 (no GPU memory — Ollama started
            before CUDA). The process is up; it is not healthy for inference.
            The body is status only, plus optional `serving` when a fallback
            can take requests. Model ids stay on /v1/info. HTTP status stays
            503 so a deploy rollback still sees a failed probe.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    const: degraded
                  serving:
                    type: string
                    const: fallback
                    description: |
                      Added in v1.4. Present only when the primary is degraded
                      and the configured fallback can serve. Absent otherwise.
  /v1/info:
    get:
      operationId: getInfo
      summary: Service and backend description; used by Apotheke "test connection"
      responses:
        "200":
          description: Service info
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Info"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {$ref: "#/components/responses/BackendUnavailable"}
  /v1/suggest:
    post:
      operationId: suggest
      summary: Suggest field values for one image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  contentMediaType: application/octet-stream
                  description: JPEG, PNG or WebP; clients SHOULD send JPEG at ~1024px long edge. HEIC/HEIF only with optional pillow-heif, else 415. Type is detected from magic bytes.
                context:
                  type: string
                  contentMediaType: application/json
                  description: JSON-encoded Context object.
            encoding:
              image:
                contentType: image/jpeg, image/png, image/webp, image/heic, image/heif, application/octet-stream
              context:
                contentType: application/json, text/plain
      responses:
        "200":
          description: Suggestions (every field optional; may be `{}`)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Suggestion"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedType"}
        "503": {$ref: "#/components/responses/BackendUnavailable"}
        "504": {$ref: "#/components/responses/BackendTimeout"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Service-wide middleware. Required on every route except /healthz when the server sets AUTOFILL_TOKEN; missing/wrong token -> 401.
  schemas:
    Capability:
      type: string
      enum: [name, tags, category, description]
    Info:
      type: object
      required: [name, version, capabilities]
      properties:
        name: {type: string, examples: [moondream-jetson]}
        version: {type: string, const: "1"}
        capabilities:
          type: array
          uniqueItems: true
          items: {$ref: "#/components/schemas/Capability"}
        backend: {type: string, examples: [echo, ollama]}
        max_image_bytes: {type: integer, minimum: 1}
        ready:
          type: boolean
          description: false while the backend is still loading its model (suggest answers 503 + Retry-After)
        avg_latency_ms:
          type: integer
          minimum: 0
          examples: [4000, 13500]
          description: |
            Added in v1.1 (additive; version stays "1"). Optional; clients MUST
            tolerate its absence.
            Typical time in milliseconds for one /v1/suggest generation on the
            loaded model (moving average of recent requests, model load time
            excluded). Absent until the backend has a measurement. Meant for
            estimated progress indicators; not a deadline or a guarantee.
        models:
          type: array
          items: {$ref: "#/components/schemas/ModelInfo"}
          description: |
            Added in v1.2 (additive; version stays "1"). Optional; absent unless
            the server sets ALLOWED_MODELS. The models a client may pick with
            `context.model`: the default first (`default: true`), then the
            allowlisted models the backend has installed. Clients MUST tolerate
            its absence and then send no `context.model`.
        image_sizes:
          type: array
          items: {$ref: "#/components/schemas/ImageSize"}
          description: |
            Added in v1.2 (additive). Optional; absent unless the server sets
            IMAGE_SIZES. Long-edge presets the client may resize photos to
            before upload, ascending, exactly one `recommended: true`. The
            service does not resize; it only advertises the presets.
        backends:
          $ref: "#/components/schemas/Backends"
          description: |
            Added in v1.4 (additive). The primary backend and the optional
            fallback, each with a state, plus whether the fallback can serve.
    ModelInfo:
      type: object
      required: [id, default]
      properties:
        id:
          type: string
          examples: [qwen2.5vl-jetson:3b]
          description: Value to send as `context.model`.
        default:
          type: boolean
          description: true for the model used when `context.model` is absent or not allowed
        loaded:
          type: boolean
          description: |
            Whether the model is listed in Ollama /api/ps right now. That is
            true while it is resident or still loading, so it is not "ready
            for a fast answer". Use `state` for that. Absent when unknown.
        state:
          type: string
          enum: [cold, loading, warm]
          description: |
            Added in v1.3. cold = not in /api/ps. loading = in /api/ps, and
            neither a background load nor a suggest for this model has finished
            successfully since it entered /api/ps. warm = a startup warm-up or
            later background reload of this model finished successfully, or a
            suggest for it finished successfully, since that residency. Clients
            use `state` to know when the model is ready for fast inference.
            Absent when /api/ps could not be read.
        size_vram:
          type: integer
          minimum: 0
          description: |
            Added in v1.3. Bytes of GPU memory Ollama reports as `size_vram`
            on /api/ps for this model. This field is the source of truth for
            GPU residency: 0 means the runner has the model but no VRAM (Ollama
            started before CUDA and is on CPU). Absent when the model is not
            in /api/ps or Ollama did not send the field.
        avg_latency_ms:
          type: integer
          minimum: 0
          description: Like Info.avg_latency_ms, for this model. Absent until measured.
    ImageSize:
      type: object
      required: [long_edge, recommended]
      properties:
        long_edge: {type: integer, minimum: 64, maximum: 8192, examples: [448, 672, 1024]}
        recommended: {type: boolean}
    Context:
      type: object
      properties:
        categories: {type: array, items: {type: string}}
        tags: {type: array, items: {type: string}}
        locale: {type: string, examples: [en, de-DE]}
        model:
          type: string
          examples: [qwen2.5vl-jetson:3b]
          description: |
            Added in v1.2, optional. One of the `models[].id` from /v1/info.
            A model that is not allowlisted or not installed falls back to the
            default; `model_used` in the response says which model answered.
    Scored:
      type: object
      required: [value]
      properties:
        value: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
    Suggestion:
      type: object
      properties:
        name: {$ref: "#/components/schemas/Scored"}
        category: {$ref: "#/components/schemas/Scored"}
        description: {$ref: "#/components/schemas/Scored"}
        tags:
          type: array
          items: {$ref: "#/components/schemas/Scored"}
        model_used:
          type: string
          examples: [qwen2.5vl-jetson:3b]
          description: Added in v1.2, optional. The model that produced this answer.
        brand:
          type: string
          maxLength: 128
          description: |
            Added in v1.3, optional string. Text printed on the item that is
            clearly readable; "" when missing or unreadable. Trimmed and
            hard-cut to 128 characters. Old clients ignore it.
        model_number:
          type: string
          maxLength: 128
          description: Same rules as `brand`. The Ollama schema asks for at most 30 characters; the service still caps at 128.
        serial_number:
          type: string
          maxLength: 128
          description: Same rules as `brand`. Values are never written to service logs.
        backend_used:
          type: string
          enum: [ollama, cloudflare]
          description: |
            Added in v1.4, optional. Which backend produced this answer.
            `model_used` is that backend's model id (the Cloudflare model id
            when `backend_used` is `cloudflare`).
    Backends:
      type: object
      additionalProperties: false
      required: [primary, fallback]
      properties:
        primary:
          type: object
          additionalProperties: false
          required: [id, state]
          properties:
            id: {type: string, examples: [ollama, cloudflare, echo]}
            state:
              type: string
              enum: [ok, warming, degraded, unavailable]
        fallback:
          type: object
          additionalProperties: false
          required: [id, state, can_serve]
          properties:
            id: {type: string, examples: [none, cloudflare]}
            state:
              type: string
              enum: ["off", ready, unavailable]
            can_serve:
              type: boolean
              description: |
                True only when a fallback is configured and allowed to take
                requests. False when FALLBACK_BACKEND is none.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, unauthorized, payload_too_large, unsupported_media_type, backend_unavailable, backend_timeout, backend_error]
            message: {type: string}
  responses:
    BadRequest:
      description: Missing image, empty image, or invalid context JSON
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Unauthorized:
      description: AUTOFILL_TOKEN is set and the bearer token is missing or wrong
      headers:
        WWW-Authenticate: {schema: {type: string}}
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    TooLarge:
      description: Image exceeds MAX_IMAGE_BYTES (default 10 MiB), advertised as max_image_bytes
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    UnsupportedType:
      description: Image bytes are not a supported format
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    BackendUnavailable:
      description: Backend not implemented, not ready, busy (queue full), or failed
      headers:
        Retry-After: {schema: {type: integer}, description: "Sent when not ready, busy, or loading a model (a cold start, e.g. a model switch with context.model). For a cold start it is that model's remaining load time in whole seconds, at least 1: Ollama uses max(15, the model's last measured load) plus a margin of max(2 s, 30%), minus the time its background load has already run (a model queued behind another load also waits for the rest of that load), capped at BACKEND_TIMEOUT_S + 5 (the recommended client timeout); echo uses the remaining simulated load time. Queue-full and switch-busy values are the in-flight model's average generation time times (waiting + 1), plus the refused request's load estimate when it switches models."}
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    BackendTimeout:
      description: Backend exceeded BACKEND_TIMEOUT_S
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
