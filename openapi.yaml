openapi: 3.1.0
info:
  title: Apotheke Autofill Service
  version: "1"
  description: |
    Suggests item field values (name, category, tags, description) from a photo.
    Any backend must implement this contract. See docs/api-v1.md.
    Clients MUST treat any non-200 response or unparsable body as "no suggestions"
    and MUST ignore unknown fields. Version bumps within v1 are additive only.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
security:
  - {}
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe (never requires auth, never calls the backend)
      security: []
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /v1/info:
    get:
      operationId: getInfo
      summary: Service and backend description; used by Apotheke "test connection"
      responses:
        "200":
          description: Service info
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Info"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {$ref: "#/components/responses/BackendUnavailable"}
  /v1/suggest:
    post:
      operationId: suggest
      summary: Suggest field values for one image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  contentMediaType: application/octet-stream
                  description: JPEG, PNG or WebP; clients SHOULD send JPEG at ~1024px long edge. HEIC/HEIF only with optional pillow-heif, else 415. Type is detected from magic bytes.
                context:
                  type: string
                  contentMediaType: application/json
                  description: JSON-encoded Context object.
            encoding:
              image:
                contentType: image/jpeg, image/png, image/webp, image/heic, image/heif, application/octet-stream
              context:
                contentType: application/json, text/plain
      responses:
        "200":
          description: Suggestions (every field optional; may be `{}`)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Suggestion"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedType"}
        "503": {$ref: "#/components/responses/BackendUnavailable"}
        "504": {$ref: "#/components/responses/BackendTimeout"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Service-wide middleware. Required on every route except /healthz when the server sets AUTOFILL_TOKEN; missing/wrong token -> 401.
  schemas:
    Capability:
      type: string
      enum: [name, tags, category, description]
    Info:
      type: object
      required: [name, version, capabilities]
      properties:
        name: {type: string, examples: [moondream-jetson]}
        version: {type: string, const: "1"}
        capabilities:
          type: array
          uniqueItems: true
          items: {$ref: "#/components/schemas/Capability"}
        backend: {type: string, examples: [echo, ollama]}
        max_image_bytes: {type: integer, minimum: 1}
        ready:
          type: boolean
          description: false while the backend is still loading its model (suggest answers 503 + Retry-After)
        avg_latency_ms:
          type: integer
          minimum: 0
          examples: [4000, 13500]
          description: |
            Added in v1.1 (additive; version stays "1"). Optional; clients MUST
            tolerate its absence.
            Typical time in milliseconds for one /v1/suggest generation on the
            loaded model (moving average of recent requests, model load time
            excluded). Absent until the backend has a measurement. Meant for
            estimated progress indicators; not a deadline or a guarantee.
        models:
          type: array
          items: {$ref: "#/components/schemas/ModelInfo"}
          description: |
            Added in v1.2 (additive; version stays "1"). Optional; absent unless
            the server sets ALLOWED_MODELS. The models a client may pick with
            `context.model`: the default first (`default: true`), then the
            allowlisted models the backend has installed. Clients MUST tolerate
            its absence and then send no `context.model`.
        image_sizes:
          type: array
          items: {$ref: "#/components/schemas/ImageSize"}
          description: |
            Added in v1.2 (additive). Optional; absent unless the server sets
            IMAGE_SIZES. Long-edge presets the client may resize photos to
            before upload, ascending, exactly one `recommended: true`. The
            service does not resize; it only advertises the presets.
    ModelInfo:
      type: object
      required: [id, default]
      properties:
        id:
          type: string
          examples: [qwen2.5vl-jetson:3b]
          description: Value to send as `context.model`.
        default:
          type: boolean
          description: true for the model used when `context.model` is absent or not allowed
        loaded:
          type: boolean
          description: Whether the model is in memory now. Picking a model that is not loaded makes the next request a cold start (it waits for the load or gets 503 + Retry-After). Absent when unknown.
        avg_latency_ms:
          type: integer
          minimum: 0
          description: Like Info.avg_latency_ms, for this model. Absent until measured.
    ImageSize:
      type: object
      required: [long_edge, recommended]
      properties:
        long_edge: {type: integer, minimum: 64, maximum: 8192, examples: [448, 672, 1024]}
        recommended: {type: boolean}
    Context:
      type: object
      properties:
        categories: {type: array, items: {type: string}}
        tags: {type: array, items: {type: string}}
        locale: {type: string, examples: [en, de-DE]}
        model:
          type: string
          examples: [qwen2.5vl-jetson:3b]
          description: |
            Added in v1.2, optional. One of the `models[].id` from /v1/info.
            A model that is not allowlisted or not installed falls back to the
            default; `model_used` in the response says which model answered.
    Scored:
      type: object
      required: [value]
      properties:
        value: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
    Suggestion:
      type: object
      properties:
        name: {$ref: "#/components/schemas/Scored"}
        category: {$ref: "#/components/schemas/Scored"}
        description: {$ref: "#/components/schemas/Scored"}
        tags:
          type: array
          items: {$ref: "#/components/schemas/Scored"}
        model_used:
          type: string
          examples: [qwen2.5vl-jetson:3b]
          description: Added in v1.2, optional. The model that produced this answer.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, unauthorized, payload_too_large, unsupported_media_type, backend_unavailable, backend_timeout, backend_error]
            message: {type: string}
  responses:
    BadRequest:
      description: Missing image, empty image, or invalid context JSON
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Unauthorized:
      description: AUTOFILL_TOKEN is set and the bearer token is missing or wrong
      headers:
        WWW-Authenticate: {schema: {type: string}}
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    TooLarge:
      description: Image exceeds MAX_IMAGE_BYTES (default 10 MiB), advertised as max_image_bytes
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    UnsupportedType:
      description: Image bytes are not a supported format
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    BackendUnavailable:
      description: Backend not implemented, not ready, busy (queue full), or failed
      headers:
        Retry-After: {schema: {type: integer}, description: Sent when not ready or busy}
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    BackendTimeout:
      description: Backend exceeded BACKEND_TIMEOUT_S
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
