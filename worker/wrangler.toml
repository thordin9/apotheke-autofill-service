# Account-specific values stay out of this file. Set the account with
# `wrangler login` or CLOUDFLARE_ACCOUNT_ID in the deployer's environment.
# There is no KV namespace: the daily cap is the SQLite Durable Object below.
# A later rename of the Budget class needs a new migrations tag.
name = "apotheke-autofill"
main = "src/index.ts"
compatibility_date = "2026-10-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# Primary hostname first. The legacy hostname stays live.
[[routes]]
pattern = "autofill.services.getapotheke.eu"
custom_domain = true

[[routes]]
pattern = "apotheke-autofill-service.webapp.gr"
custom_domain = true

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

# Plain vars so a deploy can lower the cap without a code change.
# AUTOFILL_TOKEN is not a var: `wrangler secret put AUTOFILL_TOKEN`.
# AUTOFILL_DAILY_REQUEST_CAP empty means no request cap.
[vars]
AUTOFILL_DAILY_NEURON_BUDGET = "6000"
AUTOFILL_DAILY_REQUEST_CAP = ""
MAX_UPLOAD_BYTES = "1048576"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "Budget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Budget"]

# Abuse damping only. The Durable Object is the real daily cap.
# namespace_id is an integer you choose, unique among rate-limit bindings
# on the account (bindings that share one id share counters). It is not an
# account id. Period must be 10 or 60. Limit is per Cloudflare location and
# only loosely enforced; keep it in sync with RATE_LIMIT_PERIOD_S in src/index.ts.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
[env.paid]
# Opt-in paid tier for this same Worker name. `wrangler deploy` stays free.
# `wrangler deploy --env paid` publishes these vars. Wrangler does not inherit
# vars or bindings (ai, durable_objects, ratelimits) into an environment, so
# they are repeated. Routes and migrations do inherit; they are repeated so
# the custom domain and the Budget migration do not depend on that.
name = "apotheke-autofill"

[env.paid.vars]
AUTOFILL_DAILY_NEURON_BUDGET = "30000"
AUTOFILL_DAILY_REQUEST_CAP = ""
MAX_UPLOAD_BYTES = "2097152"
TIER = "paid"

[env.paid.ai]
binding = "AI"

[[env.paid.durable_objects.bindings]]
name = "BUDGET"
class_name = "Budget"

[[env.paid.migrations]]
tag = "v1"
new_sqlite_classes = ["Budget"]

[[env.paid.routes]]
pattern = "autofill.services.getapotheke.eu"
custom_domain = true

[[env.paid.routes]]
pattern = "apotheke-autofill-service.webapp.gr"
custom_domain = true

[[env.paid.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[env.paid.limits]
cpu_ms = 500
