name: CI

# Checkout, lint, tests, and the history scan only read the repo.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit and contract tests
        env:
          BACKEND: echo
          FALLBACK_BACKEND: none
        run: pytest -q

  gitleaks:
    # Full history. The CLI needs no license. contents: read is enough.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.28.0
        run: |
          version=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan git history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1

  deploy-scripts:
    # Jetson deploy scripts: shellcheck and the fake-docker harness (bash only; no Docker, network or root).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          shellcheck --version | head -2
          shellcheck -x deploy/jetson/*.sh deploy/jetson/nm-dispatcher-* deploy/jetson/tests/run-tests.sh deploy/jetson/tests/fake-bin/*

      - name: Deploy script tests
        run: deploy/jetson/tests/run-tests.sh

  image:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Compose profiles
        run: |
          set -euo pipefail
          test "$(docker compose config --services)" = "autofill"
          docker compose config | grep -q 'BACKEND: cloudflare'
          docker compose config | grep -q 'FALLBACK_BACKEND: ollama'
          got="$(docker compose --profile ollama config --services | sort | tr '\n' ' ')"
          test "$got" = "autofill-ollama ollama ollama-init "
          docker compose --profile ollama config --format json > /tmp/compose-ollama.json
          python3 - << 'PY'
          import json
          d = json.load(open("/tmp/compose-ollama.json"))
          af = d["services"]["autofill-ollama"]["environment"]
          assert af["BACKEND"] == "ollama", af
          assert af["FALLBACK_BACKEND"] == "none", af
          assert af["OLLAMA_URL"] == "http://ollama:11434", af
          assert "OLLAMA_HOST" not in af, af
          assert af["OLLAMA_MODEL"] == "moondream", af
          init = d["services"]["ollama-init"]["environment"]
          assert init["OLLAMA_HOST"] == "http://ollama:11434", init
          assert "OLLAMA_URL" not in init, init
          PY

      - name: Build echo image (x86)
        run: docker build -t apotheke-autofill:echo .

      - name: Smoke test echo image
        run: |
          set -euo pipefail
          docker rm -f autofill-smoke >/dev/null 2>&1 || true
          docker run -d --name autofill-smoke -p 8080:8080 \
            -e BACKEND=echo \
            -e FALLBACK_BACKEND=none \
            -e AUTOFILL_TOKEN=ci-token \
            apotheke-autofill:echo
          cleanup() { docker logs autofill-smoke || true; docker rm -f autofill-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1

          # Token is set: /healthz stays open, /v1/info does not.
          curl -sf http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'
          info_code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/info)
          test "$info_code" = "401"

          python3 -c 'open("/tmp/smoke.jpg","wb").write(b"\xff\xd8\xff\xe0"+b"\x00"*64)'
          curl -sf -H 'Authorization: Bearer ci-token' \
            -F 'image=@/tmp/smoke.jpg;type=image/jpeg' \
            -F 'context={"categories":["Tools"],"tags":["bosch"],"locale":"en"}' \
            http://127.0.0.1:8080/v1/suggest > /tmp/suggest.json
          python3 -c 'import json; body=json.load(open("/tmp/suggest.json")); assert body["category"]["value"]=="Tools"'
