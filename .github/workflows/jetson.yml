# Arm64 Jetson image. Not part of the required CI workflow.
#
# dustynv/ollama:r35.4.1 is about 5.8 GB compressed and about 16 GB unpacked.
# Building it with QEMU on a GitHub-hosted runner usually runs out of disk or
# hits the job timeout, so this workflow is not a merge blocker
# (continue-on-error). Run it on purpose with workflow_dispatch, or let it
# start when Dockerfile.jetson / requirements-jetson.txt change. Build on the
# Xavier (or another native arm64 machine) when the hosted run does not finish.

name: Jetson image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile.jetson
      - requirements-jetson.txt
      - .github/workflows/jetson.yml
  push:
    branches: [main]
    paths:
      - Dockerfile.jetson
      - requirements-jetson.txt
      - .github/workflows/jetson.yml

jobs:
  jetson-image:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Jetson image (arm64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.jetson
          platforms: linux/arm64
          push: false
          tags: apotheke-autofill:jetson
          build-args: |
            L4T_TAG=r35.4.1
