# LEGACY (2026-10-20): the Jetson self-hosting deployment was decommissioned after
# Apotheke v2.5.0 moved autofill to the Cloudflare Worker. This workflow is disabled in
# the repository's Actions settings and kept for reference only. Don't re-enable it
# without a new plan. See docs/deploy-jetson.md#decommissioned-2026-10-20.
#
# Arm64 Jetson image. Not part of the required CI workflow.
#
# dustynv/ollama:r35.4.1 is about 5.8 GB compressed and about 16 GB unpacked.
# Building it with QEMU on a GitHub-hosted runner usually runs out of disk or
# hits the job timeout, so this workflow is not a merge blocker
# (continue-on-error). Run it on purpose with workflow_dispatch. Build on the
# Xavier (or another native arm64 machine) when the hosted run does not finish.

name: Jetson image

# Checkout and a local image build. Nothing is pushed.
permissions:
  contents: read

# Legacy: manual runs only (the pull_request and push triggers were removed on 2026-10-20).
on:
  workflow_dispatch:

jobs:
  jetson-image:
    runs-on: ubuntu-latest
    # A failed manual build must not block merging.
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Hosted runners do not build this image
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "Not pulling dustynv/ollama:r35.4.1 on a GitHub-hosted runner."
          echo "The base is about 5.8 GB compressed and about 16 GB unpacked."
          echo "Under QEMU that build does not reliably finish (disk and time)."
          echo "Re-run this workflow with workflow_dispatch on a larger runner,"
          echo "or build Dockerfile.jetson on the Jetson."

      - name: Set up QEMU
        if: github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Build Jetson image (arm64, no push)
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.jetson
          platforms: linux/arm64
          push: false
          tags: apotheke-autofill:jetson
          build-args: |
            L4T_TAG=r35.4.1
